<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1f8f78"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>情绪稳定</title></head><body>
<div id="authScreen" class="auth-screen hidden"><form id="loginForm" class="auth-card"><div class="brand-mark">禾</div><h1>禾账</h1><p>离线个人记账</p><div class="field"><label>用户名</label><input id="usernameInput" required placeholder="输入用户名"></div><div class="field"><label>本地口令</label><input id="passcodeInput" required type="password" placeholder="仅保存在本机"></div><button class="primary-btn" type="submit">进入账本</button></form></div>
<div id="app" class="app-shell"><aside class="sidebar"><div class="logo"><span class="brand-mark">禾</span><span>情绪稳定</span></div><div class="account-box"><div id="accountAvatar" class="avatar">U</div><div class="account-meta"><strong id="accountName">我的账本</strong><small>个人记录</small></div></div><nav class="nav"><button class="nav-item active" data-view="overview">月度总览</button><button class="nav-item" data-view="records">明细记录</button><button class="nav-item" data-view="analysis">分类分析</button><button class="nav-item" data-view="months">月份归档</button></nav><div class="sidebar-foot"><button id="exportBtn" class="ghost-btn">导出数据</button></div></aside>
<main class="main"><header class="topbar"><h2 id="viewTitle">月度总览</h2><div class="top-actions"><input id="monthInput" class="month-picker" type="month"><button id="openAddBtn" class="primary-btn">+ 记一笔</button></div></header><section id="overviewView" class="view active"></section><section id="recordsView" class="view"></section><section id="analysisView" class="view"></section><section id="monthsView" class="view"></section></main></div>
<dialog id="expenseDialog"><form id="expenseForm" class="dialog-inner"><div class="dialog-head"><h3>新增支出</h3><button id="closeExpenseBtn" type="button" class="ghost-btn">关闭</button></div><div class="field"><label>日期时间</label><input id="dateInput" name="date" type="datetime-local" required></div><div class="field"><label>金额</label><input id="amountInput" name="amount" type="number" min="0" step="0.01" required></div><div class="field"><label>大类</label><select id="majorInput" name="major"></select></div><div class="field"><label>小类</label><select id="minorInput" name="minor"></select></div><div class="field"><label>必要性</label><select id="necessityInput" name="necessity"><option>必要</option><option>可减少</option><option>非必要</option></select></div><div class="field"><label>备注</label><textarea id="noteInput" name="note" rows="2"></textarea></div><div class="dialog-actions"><button class="primary-btn" type="submit">保存记录</button></div></form></dialog><div id="toast" class="toast"></div><script src="app.js"></script></body></html>
